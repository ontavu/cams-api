name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The checks live in ci/check.sh, and they run in the image of ci/Dockerfile:
# its protoc is the canonical generator of the committed Go bindings, and it
# carries the gRPC and protobuf the C++ half is built against. The two commands
# are the ones AGENTS.md gives a person.
#
# The image is built on every run, never pulled, so that a change to
# ci/Dockerfile is checked by the run of the change that makes it.
#
# --user, the runner's, which owns the checkout: git refuses to work in a
# repository that belongs to somebody else.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cams-api-ci ci
      - run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/w" -w /w \
              cams-api-ci ci/check.sh
