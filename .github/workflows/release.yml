name: Release

# A tag becomes a release whose asset is the source tarball the cams hub builds
# its C++ codec from, by URL and SHA-256 (cams-hub/cpp/cmake/CamsApi.cmake in
# ontavu/cams). An asset rather than GitHub's archive/refs/tags tarball, which is
# generated on demand and not byte-stable: a hash of it eventually fails. The
# asset is uploaded once and never regenerated, so its hash holds.
#
# Pushing a tag is the normal way. Run by hand, from the Actions tab, it
# releases a tag that already exists and has no release yet -- one whose run
# failed for a reason outside the tag, which cannot be fixed by moving the tag.
# It then runs this file, and builds the CI image from ci/Dockerfile, as they
# are on the branch it is started from, against the content of the tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag, vX.Y.Z, that has no release yet"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # The image from the commit this workflow runs from, and only then the
      # tag: the image is outside the tag, like this file, so that a fix to it
      # lands on main and can still release a tag that predates the fix.
      - uses: actions/checkout@v4
      - run: docker build -t cams-api-ci ci
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/w" -w /w \
              cams-api-ci ci/check.sh

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      # One top-level directory, which ExternalProject strips on extraction.
      # gzip -n, so that no timestamp or name of this runner's goes into it.
      - name: Source asset
        run: |
          case "$TAG" in
              v[0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "::error::$TAG is not a release tag, vX.Y.Z"; exit 1 ;;
          esac
          version="${TAG#v}"
          # One tag names both languages, so the CMake project has to agree.
          declared="$(sed -n 's/^project(cams-api VERSION \([0-9.]*\) .*/\1/p' CMakeLists.txt)"
          if [ "$declared" != "$version" ]; then
              echo "::error::the tag is $TAG and CMakeLists.txt declares $declared"
              exit 1
          fi
          asset="cams-api-${version}.tar.gz"
          git archive --format=tar --prefix="cams-api-${version}/" HEAD | gzip -9n > "$asset"
          sha256sum "$asset" > "$asset.sha256"
          cat "$asset.sha256"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --verify-tag \
              --title "$TAG" \
              --notes "Source of cams-api $TAG. The asset is what the cams hub builds its C++ codec from; the .sha256 beside it is the hash to pin." \
              cams-api-*.tar.gz cams-api-*.tar.gz.sha256
